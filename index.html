<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Truck Parking Game</title>
<style>
body { margin: 0; background: #1a1a1a; color: #fff; font-family: sans-serif; text-align: center; }
canvas { background: #2c3e50; display: block; margin: 20px auto; border: 6px solid #34495e; box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
#ui { margin-top: 10px; }
button { padding: 10px 20px; font-size: 16px; margin: 0 5px; cursor: pointer; }
</style>
</head>
<body>
<div id="ui">
<h1>Truck Parking Game</h1>
<p>Use Arrow Keys to Drive. Back into the yellow loading dock!</p>
<button onclick="startLevel(1)">Level 1 (Empty Dock)</button>
<button onclick="startLevel(2)">Level 2 (Some Trucks)</button>
<button onclick="startLevel(3)">Level 3 (Tight Fit)</button>
</div>
<canvas id="gameCanvas" width="800" height="600"></canvas>
<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let truck = { 
    x: 400, y: 450, angle: -Math.PI/2, speed: 0, steerAngle: 0,
    trailerX: 400, trailerY: 530, trailerAngle: -Math.PI/2
};
let parkingSlot = { x: 365, y: 20, w: 70, h: 160 };
let parkedTrucks = [];
let currentLevel = 1;

const keys = {};
window.addEventListener('keydown', e => keys[e.code] = true);
window.addEventListener('keyup', e => keys[e.code] = false);

function startLevel(level) {
    currentLevel = level;
    truck = { x: 400, y: 450, angle: -Math.PI/2, speed: 0, steerAngle: 0, trailerX: 400, trailerY: 530, trailerAngle: -Math.PI/2 };
    
    if (level === 1) {
        parkedTrucks = [];
    }
    if (level === 2) {
        parkedTrucks = [{x: 280, y: 100, angle: -Math.PI/2}];
    }
    if (level === 3) {
        parkedTrucks = [
            {x: 120, y: 100, angle: -Math.PI/2},
            {x: 200, y: 100, angle: -Math.PI/2},
            {x: 280, y: 100, angle: -Math.PI/2},
            {x: 520, y: 100, angle: -Math.PI/2},
            {x: 600, y: 100, angle: -Math.PI/2},
            {x: 680, y: 100, angle: -Math.PI/2}
        ];
    }
}

function update() {
    if (keys['ArrowUp']) truck.speed = Math.min(truck.speed + 0.04, 1.5);
    else if (keys['ArrowDown']) truck.speed = Math.max(truck.speed - 0.04, -1.0);
    else truck.speed *= 0.92;

    if (keys['ArrowLeft']) truck.steerAngle = Math.max(truck.steerAngle - 0.04, -0.6);
    else if (keys['ArrowRight']) truck.steerAngle = Math.min(truck.steerAngle + 0.04, 0.6);
    else truck.steerAngle *= 0.85;

    let wheelbase = 40;
    truck.x += Math.cos(truck.angle) * truck.speed;
    truck.y += Math.sin(truck.angle) * truck.speed;
    truck.angle += (truck.speed / wheelbase) * Math.tan(truck.steerAngle);

    let hitchX = truck.x - Math.cos(truck.angle) * 20;
    let hitchY = truck.y - Math.sin(truck.angle) * 20;
    
    let dx = hitchX - truck.trailerX;
    let dy = hitchY - truck.trailerY;
    let dist = Math.sqrt(dx*dx + dy*dy);
    
    if (dist > 0) {
        truck.trailerX += (dx / dist) * (dist - 60);
        truck.trailerY += (dy / dist) * (dist - 60);
    }
    
    let tdx = hitchX - truck.trailerX;
    let tdy = hitchY - truck.trailerY;
    truck.trailerAngle = Math.atan2(tdy, tdx);
}

function drawTruck(x, y, angle, trailerX, trailerY, trailerAngle, isPlayer) {
    // Draw Trailer
    ctx.save();
    ctx.translate(trailerX, trailerY);
    ctx.rotate(trailerAngle);
    ctx.fillStyle = isPlayer ? '#e67e22' : '#7f8c8d';
    ctx.fillRect(-60, -25, 90, 50);
    ctx.fillStyle = isPlayer ? '#d35400' : '#616a6b';
    ctx.fillRect(-55, -22, 80, 44);
    ctx.restore();

    // Draw Cab
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(angle);
    ctx.fillStyle = isPlayer ? '#c0392b' : '#34495e';
    ctx.fillRect(-20, -20, 50, 40);
    ctx.fillStyle = isPlayer ? '#e74c3c' : '#5dade2';
    ctx.fillRect(-5, -16, 30, 32);
    ctx.fillStyle = '#bdc3c7';
    ctx.fillRect(15, -14, 10, 28);
    ctx.restore();
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    // Draw Cargo Hold Floor
    ctx.fillStyle = '#2c3e50';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    // Draw Loading Dock Area
    ctx.fillStyle = '#34495e';
    ctx.fillRect(0, 0, canvas.width, 180);
    
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    for(let i=0; i<=800; i+=80) {
        ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, 180); ctx.stroke();
    }
    
    // Draw Parking Slot
    ctx.strokeStyle = '#f1c40f';
    ctx.lineWidth = 4;
    ctx.strokeRect(parkingSlot.x, parkingSlot.y, parkingSlot.w, parkingSlot.h);
    
    // Draw Parked Trucks
    parkedTrucks.forEach(t => {
        let ty = t.y + 80;
        drawTruck(t.x, t.y, t.angle, t.x, ty, t.angle, false);
    });

    // Draw Player Truck
    drawTruck(truck.x, truck.y, truck.angle, truck.trailerX, truck.trailerY, truck.trailerAngle, true);
}

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
