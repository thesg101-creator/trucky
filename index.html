<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Truck Parking Game</title>
<style>
body { margin: 0; background: #1a1a1a; color: #fff; font-family: sans-serif; text-align: center; }
canvas { background: #2c3e50; display: block; margin: 20px auto; border: 6px solid #34495e; box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
#ui { margin-top: 10px; }
button { padding: 10px 20px; font-size: 16px; margin: 0 5px; cursor: pointer; }
</style>
</head>
<body>
<div id="ui">
<h1>Truck Parking Game</h1>
<p>Use Arrow Keys to Drive. Park in the yellow slot!</p>
<button onclick="startLevel(1)">Level 1 (Empty)</button>
<button onclick="startLevel(2)">Level 2 (Some Trucks)</button>
<button onclick="startLevel(3)">Level 3 (Tight Fit)</button>
</div>
<canvas id="gameCanvas" width="800" height="600"></canvas>
<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let truck = { 
    x: 150, y: 300, angle: 0, speed: 0, steerAngle: 0,
    trailerX: 90, trailerY: 300, trailerAngle: 0
};
let parkingSlot = { x: 600, y: 250, w: 140, h: 60 };
let parkedTrucks = [];
let currentLevel = 1;

const keys = {};
window.addEventListener('keydown', e => keys[e.code] = true);
window.addEventListener('keyup', e => keys[e.code] = false);

function startLevel(level) {
    currentLevel = level;
    truck = { x: 150, y: 300, angle: 0, speed: 0, steerAngle: 0, trailerX: 90, trailerY: 300, trailerAngle: 0 };
    
    if (level === 1) {
        parkedTrucks = [];
        parkingSlot = { x: 600, y: 250, w: 140, h: 60 };
    }
    if (level === 2) {
        parkedTrucks = [{x: 600, y: 150, angle: 0}];
        parkingSlot = { x: 600, y: 250, w: 140, h: 60 };
    }
    if (level === 3) {
        parkedTrucks = [{x: 600, y: 170, angle: 0}, {x: 600, y: 330, angle: 0}];
        parkingSlot = { x: 600, y: 250, w: 140, h: 60 };
    }
}

function update() {
    if (keys['ArrowUp']) truck.speed = Math.min(truck.speed + 0.05, 2.0);
    else if (keys['ArrowDown']) truck.speed = Math.max(truck.speed - 0.05, -1.0);
    else truck.speed *= 0.92;

    if (keys['ArrowLeft']) truck.steerAngle = Math.max(truck.steerAngle - 0.05, -0.5);
    else if (keys['ArrowRight']) truck.steerAngle = Math.min(truck.steerAngle + 0.05, 0.5);
    else truck.steerAngle *= 0.8;

    // Bicycle model for realistic turning
    let wheelbase = 30;
    truck.x += Math.cos(truck.angle) * truck.speed;
    truck.y += Math.sin(truck.angle) * truck.speed;
    truck.angle += (truck.speed / wheelbase) * Math.tan(truck.steerAngle);

    // Physics-based trailer tracking
    let hitchX = truck.x - Math.cos(truck.angle) * 15;
    let hitchY = truck.y - Math.sin(truck.angle) * 15;
    
    let dx = hitchX - truck.trailerX;
    let dy = hitchY - truck.trailerY;
    let dist = Math.sqrt(dx*dx + dy*dy);
    
    if (dist > 0) {
        truck.trailerX += (dx / dist) * (dist - 45);
        truck.trailerY += (dy / dist) * (dist - 45);
    }
    
    let tdx = hitchX - truck.trailerX;
    let tdy = hitchY - truck.trailerY;
    truck.trailerAngle = Math.atan2(tdy, tdx);
}

function drawTruck(x, y, angle, trailerX, trailerY, trailerAngle, isPlayer) {
    // Draw Trailer
    ctx.save();
    ctx.translate(trailerX, trailerY);
    ctx.rotate(trailerAngle);
    ctx.fillStyle = isPlayer ? '#e67e22' : '#7f8c8d';
    ctx.fillRect(-45, -18, 70, 36);
    ctx.fillStyle = isPlayer ? '#d35400' : '#616a6b';
    ctx.fillRect(-40, -15, 60, 30);
    ctx.restore();

    // Draw Cab
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(angle);
    ctx.fillStyle = isPlayer ? '#c0392b' : '#34495e';
    ctx.fillRect(-15, -15, 40, 30);
    ctx.fillStyle = isPlayer ? '#e74c3c' : '#5dade2';
    ctx.fillRect(-5, -12, 25, 24);
    ctx.fillStyle = '#bdc3c7';
    ctx.fillRect(10, -10, 8, 20);
    ctx.restore();
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    // Draw Cargo Hold Floor
    ctx.fillStyle = '#2c3e50';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.strokeStyle = '#34495e';
    ctx.lineWidth = 1;
    for(let i=0; i<800; i+=40) { ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,600); ctx.stroke(); }
    for(let i=0; i<600; i+=40) { ctx.beginPath(); ctx.moveTo(0,i); ctx.lineTo(800,i); ctx.stroke(); }
    
    // Draw Parking Slot
    ctx.strokeStyle = '#f1c40f';
    ctx.lineWidth = 4;
    ctx.strokeRect(parkingSlot.x, parkingSlot.y, parkingSlot.w, parkingSlot.h);
    
    // Draw Parked Trucks
    parkedTrucks.forEach(t => {
        let tx = t.x - 60;
        drawTruck(t.x, t.y, t.angle, tx, t.y, t.angle, false);
    });

    // Draw Player Truck
    drawTruck(truck.x, truck.y, truck.angle, truck.trailerX, truck.trailerY, truck.trailerAngle, true);
}

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
