<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Truck Bay Parking</title>
  <style>
    :root {
      --bg: #0d151b;
      --panel: #101a23;
      --panel-2: #162531;
      --line: #edf3ff;
      --line-soft: rgba(237,243,255,0.2);
      --gold: #f8c75a;
      --gold-soft: rgba(248,199,90,0.18);
      --green: #48d89d;
      --red: #f26f6f;
      --shadow: rgba(0,0,0,0.35);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(180deg, #0a1118, #0e171f);
      font-family: Arial, Helvetica, sans-serif;
      color: #edf3ff;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
    }

    .game-shell {
      width: 960px;
      max-width: 100%;
      background: rgba(10, 16, 22, 0.94);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      box-shadow: 0 28px 60px rgba(0,0,0,0.38);
      overflow: hidden;
    }

    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 12px 18px;
      background: rgba(15, 24, 33, 0.9);
      border-bottom: 1px solid rgba(255,255,255,0.08);
      min-height: 52px;
      flex-wrap: wrap;
    }

    #missionText {
      font-size: 0.98rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      color: #eff6ff;
    }

    #statusPill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 88px;
      padding: 7px 12px;
      border-radius: 999px;
      font-size: 0.74rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      border: 1px solid rgba(74, 222, 128, 0.4);
      background: rgba(74, 222, 128, 0.14);
      color: #bbf7d0;
    }

    canvas {
      display: block;
      width: 960px;
      height: 620px;
      max-width: 100%;
      background: linear-gradient(180deg, #1d2d38 0%, #101a23 100%);
      image-rendering: auto;
    }

    @media (max-width: 760px) {
      body { padding: 8px; }
      .game-shell { border-radius: 10px; }
      .status-row { padding: 10px 12px; }
    }
  </style>
</head>
<body>
  <div class="game-shell">
    <div class="status-row">
      <div id="missionText">Find the glowing bay and back in clean.</div>
      <div id="statusPill">Ready</div>
    </div>
    <canvas id="gameCanvas" width="960" height="620"></canvas>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const missionText = document.getElementById('missionText');
    const statusPill = document.getElementById('statusPill');

    const keys = {};
    let animationId = null;
    let lastFrame = 0;

    const audio = {
      ctx: null,
      master: null,
      humOsc: null,
      humGain: null,
      init() {
        if (this.ctx) return;
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        this.ctx = new AudioCtx();
        this.master = this.ctx.createGain();
        this.master.gain.value = 0.08;
        this.master.connect(this.ctx.destination);

        this.humOsc = this.ctx.createOscillator();
        this.humOsc.type = 'sawtooth';
        this.humOsc.frequency.value = 48;

        this.humGain = this.ctx.createGain();
        this.humGain.gain.value = 0.0001;

        this.humOsc.connect(this.humGain);
        this.humGain.connect(this.master);
        this.humOsc.start();
      },
      setEngine(speed) {
        if (!this.ctx || !this.humGain) return;
        const target = 0.015 + Math.min(0.11, Math.abs(speed) * 0.04);
        this.humGain.gain.setTargetAtTime(target, this.ctx.currentTime, 0.12);
        this.humOsc.frequency.setTargetAtTime(42 + Math.abs(speed) * 26, this.ctx.currentTime, 0.12);
      },
      tone(freq, duration = 0.16, volume = 0.07, sweep = 0) {
        if (!this.ctx || !this.master) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
        if (sweep) osc.frequency.linearRampToValueAtTime(freq + sweep, this.ctx.currentTime + duration);
        gain.gain.setValueAtTime(0.0001, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(volume, this.ctx.currentTime + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);
        osc.connect(gain);
        gain.connect(this.master);
        osc.start();
        osc.stop(this.ctx.currentTime + duration + 0.02);
      },
      success() {
        this.tone(540, 0.12, 0.08, 120);
        this.tone(760, 0.14, 0.08, 180);
      },
      hit() {
        this.tone(180, 0.16, 0.07, -70);
      }
    };

    const game = {
      level: 1,
      score: 0,
      combo: 0,
      bestCombo: 0,
      totalLoaded: 0,
      perfectParks: 0,
      collisions: 0,
      status: 'playing',
      parkingSpaces: [],
      parkedTrucks: [],
      targetSlot: null,
      lastHitAt: 0,
      elapsed: 0
    };

    const player = {
      x: 120,
      y: 490,
      angle: 0,
      speed: 0,
      steer: 0,
      cabLength: 42,
      cabWidth: 22,
      trailerLength: 92,
      trailerWidth: 28,
      hitchLength: 72,
      trailerX: 120,
      trailerY: 410,
      trailerAngle: 0,
      maxSpeed: 2.7,
      maxReverse: 1.7
    };

    function clamp(value, min, max) {
      return Math.min(max, Math.max(min, value));
    }

    function normalizeAngle(a) {
      while (a > Math.PI) a -= Math.PI * 2;
      while (a < -Math.PI) a += Math.PI * 2;
      return a;
    }

    function shuffle(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function setStatus(text, tone = 'ready') {
      missionText.textContent = text;
      if (tone === 'ready') {
        statusPill.textContent = 'Ready';
        statusPill.style.background = 'rgba(74, 222, 128, 0.12)';
        statusPill.style.borderColor = 'rgba(74, 222, 128, 0.42)';
        statusPill.style.color = '#bbf7d0';
      } else if (tone === 'parked') {
        statusPill.textContent = 'Loaded';
        statusPill.style.background = 'rgba(59,130,246,0.14)';
        statusPill.style.borderColor = 'rgba(96,165,250,0.42)';
        statusPill.style.color = '#dbeafe';
      } else if (tone === 'hit') {
        statusPill.textContent = 'Impact';
        statusPill.style.background = 'rgba(248,113,113,0.12)';
        statusPill.style.borderColor = 'rgba(248,113,113,0.45)';
        statusPill.style.color = '#fecaca';
      }
    }

    function rectForVehicle(x, y, width, length, angle) {
      const hw = width / 2;
      const hl = length / 2;
      const pts = [
        { x: -hw, y: -hl },
        { x:  hw, y: -hl },
        { x:  hw, y:  hl },
        { x: -hw, y:  hl }
      ].map((p) => {
        const cos = Math.cos(angle);
        const sin = Math.sin(angle);
        return {
          x: x + p.x * cos - p.y * sin,
          y: y + p.x * sin + p.y * cos
        };
      });
      const xs = pts.map(p => p.x);
      const ys = pts.map(p => p.y);
      return { x: Math.min(...xs), y: Math.min(...ys), w: Math.max(...xs) - Math.min(...xs), h: Math.max(...ys) - Math.min(...ys) };
    }

    function overlaps(a, b) {
      return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
    }

    function resetPlayer() {
      player.x = 120;
      player.y = 506;
      player.angle = 0;
      player.speed = 0;
      player.steer = 0;
      player.trailerX = player.x - Math.cos(player.angle) * player.hitchLength;
      player.trailerY = player.y - Math.sin(player.angle) * player.hitchLength;
      player.trailerAngle = player.angle;
    }

    function buildLevel(level) {
      game.level = level;
      game.status = 'playing';
      game.parkingSpaces = [];
      game.parkedTrucks = [];

      const slotLayout = [
        { x: 86, y: 90, w: 150, h: 150 },
        { x: 262, y: 90, w: 150, h: 150 },
        { x: 438, y: 90, w: 150, h: 150 },
        { x: 614, y: 90, w: 150, h: 150 },
        { x: 86, y: 270, w: 150, h: 150 },
        { x: 262, y: 270, w: 150, h: 150 },
        { x: 438, y: 270, w: 150, h: 150 },
        { x: 614, y: 270, w: 150, h: 150 }
      ];

      slotLayout.forEach((slot, index) => {
        game.parkingSpaces.push({ ...slot, occupied: false, target: false, id: index });
      });

      const occupiedCount = clamp(3 + Math.floor(level / 2), 3, 6);
      const occupied = shuffle([...game.parkingSpaces.keys()]).slice(0, occupiedCount);
      occupied.forEach((idx) => {
        game.parkingSpaces[idx].occupied = true;
      });

      game.parkingSpaces.forEach((space, index) => {
        if (!space.occupied) return;
        game.parkedTrucks.push({
          x: space.x + space.w / 2,
          y: space.y + space.h / 2,
          width: 34,
          length: 72,
          angle: 0,
          color: (index % 2 === 0) ? '#586779' : '#6a7d8b'
        });
      });

      const open = game.parkingSpaces.filter((space) => !space.occupied);
      game.targetSlot = open[Math.floor(Math.random() * open.length)];
      game.targetSlot.target = true;

      resetPlayer();
      setStatus(`Level ${level}: Back into the highlighted bay and keep the lot clean.`, 'ready');
    }

    function updatePlayer(dt) {
      if (game.status !== 'playing') return;

      const drive = keys['ArrowUp'] || keys['KeyW'];
      const reverse = keys['ArrowDown'] || keys['KeyS'];
      const left = keys['ArrowLeft'] || keys['KeyA'];
      const right = keys['ArrowRight'] || keys['KeyD'];

      if (left) player.steer = clamp(player.steer - 0.075, -1.15, 1.15);
      else if (right) player.steer = clamp(player.steer + 0.075, -1.15, 1.15);
      else player.steer *= 0.78;

      if (drive) player.speed += 0.17 * dt * 0.06;
      else if (reverse) player.speed -= 0.15 * dt * 0.06;
      else player.speed *= 0.985;

      player.speed = clamp(player.speed, -player.maxReverse, player.maxSpeed);
      const turnFactor = clamp(Math.abs(player.speed) / player.maxSpeed, 0.25, 1);
      player.angle += (player.speed / 50) * player.steer * turnFactor;

      const nextX = player.x + Math.cos(player.angle) * player.speed * 60 * (dt / 16.67);
      const nextY = player.y + Math.sin(player.angle) * player.speed * 60 * (dt / 16.67);

      player.x = clamp(nextX, 48, canvas.width - 48);
      player.y = clamp(nextY, 80, canvas.height - 60);

      const targetTrailerX = player.x - Math.cos(player.angle) * player.hitchLength;
      const targetTrailerY = player.y - Math.sin(player.angle) * player.hitchLength;
      const targetTrailerAngle = player.angle + player.steer * 0.25 * (Math.abs(player.speed) / player.maxSpeed);

      player.trailerX += (targetTrailerX - player.trailerX) * 0.22;
      player.trailerY += (targetTrailerY - player.trailerY) * 0.22;
      player.trailerAngle += normalizeAngle(targetTrailerAngle - player.trailerAngle) * 0.18;

      audio.init();
      audio.setEngine(player.speed);
    }

    function checkCollisions() {
      if (game.status !== 'playing') return;

      const cabRect = rectForVehicle(player.x, player.y, player.cabWidth, player.cabLength, player.angle);
      const trailerRect = rectForVehicle(player.trailerX, player.trailerY, player.trailerWidth, player.trailerLength, player.trailerAngle);

      for (const parked of game.parkedTrucks) {
        const rect = {
          x: parked.x - parked.width / 2,
          y: parked.y - parked.length / 2,
          w: parked.width,
          h: parked.length
        };
        if (overlaps(cabRect, rect) || overlaps(trailerRect, rect)) {
          const now = performance.now();
          if (now - game.lastHitAt > 350) {
            game.lastHitAt = now;
            game.collisions += 1;
            game.combo = 0;
            game.score = Math.max(0, game.score - 40);
            player.speed *= -0.24;
            audio.hit();
            setStatus('Contact! Slow down and line it up.', 'hit');
          }
          return;
        }
      }

      const lotRect = { x: 24, y: 52, w: canvas.width - 48, h: canvas.height - 100 };
      const out = player.x < lotRect.x || player.x > lotRect.x + lotRect.w || player.y < lotRect.y || player.y > lotRect.y + lotRect.h;
      if (out) {
        const now = performance.now();
        if (now - game.lastHitAt > 350) {
          game.lastHitAt = now;
          game.collisions += 1;
          game.combo = 0;
          game.score = Math.max(0, game.score - 20);
          player.speed *= -0.18;
          audio.hit();
          setStatus('Stay on the lot. The curb is not a parking spot.', 'hit');
        }
        return;
      }

      setStatus(`Level ${game.level}: Back into the highlighted bay and keep the lot clean.`, 'ready');
    }

    function checkParking() {
      if (game.status !== 'playing' || !game.targetSlot) return;

      const bay = game.targetSlot;
      const bayRect = { x: bay.x, y: bay.y, w: bay.w, h: bay.h };
      const cabRect = rectForVehicle(player.x, player.y, player.cabWidth, player.cabLength, player.angle);
      const trailerRect = rectForVehicle(player.trailerX, player.trailerY, player.trailerWidth, player.trailerLength, player.trailerAngle);

      const insideBay =
        cabRect.x > bayRect.x + 6 && cabRect.x + cabRect.w < bayRect.x + bayRect.w - 6 &&
        cabRect.y > bayRect.y + 6 && cabRect.y + cabRect.h < bayRect.y + bayRect.h - 6 &&
        trailerRect.x > bayRect.x + 6 && trailerRect.x + trailerRect.w < bayRect.x + bayRect.w - 6 &&
        trailerRect.y > bayRect.y + 6 && trailerRect.y + trailerRect.h < bayRect.y + bayRect.h - 6;

      const aligned = Math.abs(normalizeAngle(player.angle)) < 0.28;
      const slowEnough = Math.abs(player.speed) < 0.18;

      if (insideBay && aligned && slowEnough) {
        game.status = 'parked';
        game.combo += 1;
        game.bestCombo = Math.max(game.bestCombo, game.combo);
        game.totalLoaded += 1;
        game.score += 500 + game.level * 120 + game.combo * 100;

        const perfect = Math.abs(player.speed) < 0.08 && Math.abs(normalizeAngle(player.angle)) < 0.1;
        if (perfect) {
          game.perfectParks += 1;
          game.score += 200;
        }

        audio.success();
        setStatus(`Docked! Great job. Combo ${game.combo}x.`, 'parked');

        setTimeout(() => {
          game.level += 1;
          buildLevel(game.level);
        }, 1200);
      }
    }

    function drawBackground() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#0d171f';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#143d34';
      ctx.fillRect(0, 0, canvas.width, 70);
      ctx.fillRect(0, canvas.height - 70, canvas.width, 70);

      ctx.fillStyle = '#2d3748';
      ctx.fillRect(20, 70, canvas.width - 40, canvas.height - 140);

      ctx.strokeStyle = 'rgba(255,255,255,0.12)';
      ctx.lineWidth = 2;
      for (let x = 60; x < canvas.width; x += 90) {
        ctx.beginPath();
        ctx.moveTo(x, 70);
        ctx.lineTo(x, canvas.height - 70);
        ctx.stroke();
      }
    }

    function drawParkingSpaces() {
      for (const space of game.parkingSpaces) {
        ctx.save();
        ctx.fillStyle = space.target ? 'rgba(248,199,90,0.18)' : 'rgba(255,255,255,0.04)';
        ctx.strokeStyle = space.target ? '#f8c75a' : '#edf3ff';
        ctx.lineWidth = space.target ? 4 : 2;
        ctx.fillRect(space.x, space.y, space.w, space.h);
        ctx.strokeRect(space.x, space.y, space.w, space.h);

        ctx.strokeStyle = 'rgba(255,255,255,0.18)';
        ctx.beginPath();
        ctx.moveTo(space.x + 10, space.y + 10);
        ctx.lineTo(space.x + space.w - 10, space.y + 10);
        ctx.stroke();
        ctx.restore();
      }
    }

    function drawParkedTruck(truck) {
      ctx.save();
      ctx.translate(truck.x, truck.y);
      ctx.rotate(truck.angle);
      ctx.fillStyle = truck.color;
      ctx.fillRect(-truck.width / 2, -truck.length / 2, truck.width, truck.length);
      ctx.fillStyle = '#dfe7f2';
      ctx.fillRect(-truck.width / 2 + 6, -truck.length / 2 + 8, truck.width - 12, truck.length - 16);
      ctx.restore();
    }

    function drawTrailer(x, y, angle, color) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(angle);
      ctx.fillStyle = color;
      ctx.fillRect(-40, -16, 80, 32);
      ctx.fillStyle = 'rgba(255,255,255,0.26)';
      ctx.fillRect(-34, -12, 68, 24);
      ctx.restore();
    }

    function drawCab(x, y, angle, color) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(angle);
      ctx.fillStyle = color;
      ctx.fillRect(-18, -12, 36, 24);
      ctx.fillStyle = '#dbeafe';
      ctx.fillRect(-5, -8, 18, 16);
      ctx.restore();
    }

    function drawTruck() {
      drawTrailer(player.trailerX, player.trailerY, player.trailerAngle, '#f59e0b');
      drawCab(player.x, player.y, player.angle, '#ef4444');
    }

    function draw() {
      drawBackground();
      drawParkingSpaces();
      for (const parked of game.parkedTrucks) drawParkedTruck(parked);
      drawTruck();
    }

    function loop(timestamp) {
      const dt = Math.min(32, timestamp - lastFrame || 16);
      lastFrame = timestamp;
      game.elapsed += dt;

      updatePlayer(dt);
      checkCollisions();
      checkParking();
      draw();
      animationId = requestAnimationFrame(loop);
    }

    function initControls() {
      window.addEventListener('keydown', (event) => {
        if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(event.code)) event.preventDefault();
        keys[event.code] = true;
      });
      window.addEventListener('keyup', (event) => {
        keys[event.code] = false;
      });
    }

    function startGame() {
      game.score = 0;
      game.combo = 0;
      game.bestCombo = 0;
      game.totalLoaded = 0;
      game.perfectParks = 0;
      game.collisions = 0;
      game.elapsed = 0;
      buildLevel(1);
      if (animationId) cancelAnimationFrame(animationId);
      animationId = requestAnimationFrame(loop);
    }

    audio.init();
    initControls();
    buildLevel(1);
    animationId = requestAnimationFrame(loop);
  </script>
</body>
</html>
