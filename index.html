<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Truck Yard Parking</title>
  <style>
    :root {
      --bg: #0a121a;
      --panel: #101c28;
      --panel-2: #162534;
      --line: #e3ebf7;
      --gold: #f5c451;
      --gold-soft: rgba(245,196,81,0.25);
      --green: #36d399;
      --green-soft: rgba(54,211,153,0.18);
      --red: #f87171;
      --hud: #edf3ff;
      --muted: #a7bacc;
      --road: #2d3748;
      --grass: #183b2e;
      --shadow: rgba(0,0,0,0.30);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at top, rgba(96,165,250,0.15), transparent 35%),
        linear-gradient(180deg, #090f17 0%, #0d1722 100%);
      font-family: Arial, Helvetica, sans-serif;
      color: var(--hud);
      padding: 18px;
    }

    .shell {
      width: min(1100px, 96vw);
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid rgba(148,163,184,0.18);
      background: rgba(10,17,25,0.88);
      box-shadow: 0 30px 60px rgba(0,0,0,0.45);
    }

    .topbar {
      display: grid;
      grid-template-columns: repeat(5, minmax(120px, 1fr));
      gap: 10px;
      padding: 14px 18px;
      background: linear-gradient(180deg, rgba(16,28,40,0.96), rgba(22,37,52,0.96));
      border-bottom: 1px solid rgba(148,163,184,0.12);
    }

    .stat {
      background: rgba(24,38,52,0.9);
      border: 1px solid rgba(148,163,184,0.18);
      border-radius: 12px;
      padding: 10px 12px;
      min-height: 78px;
    }

    .label {
      display: block;
      color: var(--muted);
      font-size: 0.64rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .value {
      font-size: clamp(1.1rem, 1.75vw, 1.8rem);
      font-weight: 800;
      color: white;
    }

    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 12px 18px;
      background: rgba(11,19,27,0.95);
      border-bottom: 1px solid rgba(148,163,184,0.12);
      flex-wrap: wrap;
    }

    #missionText {
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .pill {
      border-radius: 999px;
      background: rgba(13,148,136,0.18);
      border: 1px solid rgba(45,212,191,0.4);
      color: #a7f3d0;
      padding: 7px 12px;
      font-size: 0.76rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      background: linear-gradient(180deg, #1d2b38, #132027);
    }

    @media (max-width: 760px) {
      .topbar { grid-template-columns: repeat(2, minmax(120px, 1fr)); }
    }
  </style>
</head>
<body>
  <div class="shell">
    <div id="hud" class="topbar"></div>
    <div class="status-row">
      <div id="missionText">Find the glowing bay and back in clean.</div>
      <div id="statusPill" class="pill">Ready</div>
    </div>
    <canvas id="gameCanvas" width="960" height="640"></canvas>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const hud = document.getElementById('hud');
    const missionText = document.getElementById('missionText');
    const statusPill = document.getElementById('statusPill');

    const keys = {};
    let animationId = null;
    let lastFrame = 0;

    const audio = {
      ctx: null,
      master: null,
      humOsc: null,
      humGain: null,
      init() {
        if (this.ctx) return;
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        this.ctx = new AudioCtx();
        this.master = this.ctx.createGain();
        this.master.connect(this.ctx.destination);
        this.master.gain.value = 0.09;

        this.humOsc = this.ctx.createOscillator();
        this.humOsc.type = 'sawtooth';
        this.humOsc.frequency.value = 48;

        this.humGain = this.ctx.createGain();
        this.humGain.gain.value = 0.0001;

        this.humOsc.connect(this.humGain);
        this.humGain.connect(this.master);
        this.humOsc.start();
      },
      setEngine(speed) {
        if (!this.ctx || !this.humGain) return;
        const target = 0.015 + Math.min(0.11, Math.abs(speed) * 0.045);
        this.humGain.gain.setTargetAtTime(target, this.ctx.currentTime, 0.12);
        this.humOsc.frequency.setTargetAtTime(40 + Math.abs(speed) * 28, this.ctx.currentTime, 0.12);
      },
      tone(freq, duration = 0.15, volume = 0.08, sweep = 0) {
        if (!this.ctx || !this.master) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
        if (sweep) osc.frequency.linearRampToValueAtTime(freq + sweep, this.ctx.currentTime + duration);
        gain.gain.setValueAtTime(0.0001, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(volume, this.ctx.currentTime + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);
        osc.connect(gain);
        gain.connect(this.master);
        osc.start();
        osc.stop(this.ctx.currentTime + duration + 0.02);
      },
      success() {
        this.tone(440, 0.12, 0.09, 120);
        this.tone(660, 0.14, 0.09, 180);
      },
      hit() {
        this.tone(180, 0.2, 0.07, -80);
      }
    };

    const game = {
      level: 1,
      score: 0,
      combo: 0,
      bestCombo: 0,
      totalLoaded: 0,
      perfectParks: 0,
      collisions: 0,
      totalDistance: 0,
      elapsed: 0,
      status: 'playing',
      parkingSpaces: [],
      parkedTrucks: [],
      targetSlot: null,
      lastHitAt: 0
    };

    const player = {
      x: 130,
      y: 500,
      angle: 0,
      speed: 0,
      steer: 0,
      width: 30,
      length: 68,
      trailerX: 50,
      trailerY: 430,
      trailerAngle: 0,
      trailerWidth: 30,
      trailerLength: 110,
      hitchLength: 88,
      maxSpeed: 2.7,
      maxReverse: 1.8
    };

    function clamp(value, min, max) {
      return Math.min(max, Math.max(min, value));
    }

    function normalizeAngle(a) {
      while (a > Math.PI) a -= Math.PI * 2;
      while (a < -Math.PI) a += Math.PI * 2;
      return a;
    }

    function distance(a, b) {
      return Math.hypot(a.x - b.x, a.y - b.y);
    }

    function rand(min, max) {
      return min + Math.random() * (max - min);
    }

    function shuffle(list) {
      const copy = [...list];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function setStatus(text, tone = 'ready') {
      missionText.textContent = text;
      if (tone === 'ready') {
        statusPill.textContent = 'Ready';
        statusPill.style.background = 'rgba(13,148,136,0.18)';
        statusPill.style.borderColor = 'rgba(45,212,191,0.4)';
        statusPill.style.color = '#a7f3d0';
      } else if (tone === 'parked') {
        statusPill.textContent = 'Loaded';
        statusPill.style.background = 'rgba(54,211,153,0.18)';
        statusPill.style.borderColor = 'rgba(54,211,153,0.4)';
        statusPill.style.color = '#a7f3d0';
      } else if (tone === 'hit') {
        statusPill.textContent = 'Impact';
        statusPill.style.background = 'rgba(248,113,113,0.18)';
        statusPill.style.borderColor = 'rgba(248,113,113,0.45)';
        statusPill.style.color = '#fecaca';
      }
    }

    function updateHUD() {
      const accuracy = game.totalLoaded === 0 ? 0 : Math.round((game.perfectParks / game.totalLoaded) * 100);
      hud.innerHTML = `
        <div class="stat"><span class="label">Level</span><span class="value">${game.level}</span></div>
        <div class="stat"><span class="label">Score</span><span class="value">${game.score}</span></div>
        <div class="stat"><span class="label">Loaded</span><span class="value">${game.totalLoaded}</span></div>
        <div class="stat"><span class="label">Combo</span><span class="value">${game.combo}x</span></div>
        <div class="stat"><span class="label">Best</span><span class="value">${game.bestCombo}</span></div>
        <div class="stat"><span class="label">Perfect</span><span class="value">${game.perfectParks}</span></div>
        <div class="stat"><span class="label">Collisions</span><span class="value">${game.collisions}</span></div>
        <div class="stat"><span class="label">Distance</span><span class="value">${Math.round(game.totalDistance)}m</span></div>
        <div class="stat"><span class="label">Time</span><span class="value">${(game.elapsed / 1000).toFixed(1)}s</span></div>
        <div class="stat"><span class="label">Accuracy</span><span class="value">${accuracy}%</span></div>
      `;
    }

    function rectFromBox(x, y, w, h, angle) {
      const hw = w / 2;
      const hh = h / 2;
      const corners = [
        { x: -hw, y: -hh },
        { x:  hw, y: -hh },
        { x:  hw, y:  hh },
        { x: -hw, y:  hh }
      ].map((p) => {
        const cos = Math.cos(angle);
        const sin = Math.sin(angle);
        return {
          x: x + p.x * cos - p.y * sin,
          y: y + p.x * sin + p.y * cos
        };
      });
      const xs = corners.map((p) => p.x);
      const ys = corners.map((p) => p.y);
      return { x: Math.min(...xs), y: Math.min(...ys), w: Math.max(...xs) - Math.min(...xs), h: Math.max(...ys) - Math.min(...ys) };
    }

    function overlaps(a, b) {
      return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
    }

    function resetPlayer() {
      player.x = 160;
      player.y = 530;
      player.angle = 0;
      player.speed = 0;
      player.steer = 0;
      player.trailerX = player.x - Math.cos(player.angle) * player.hitchLength;
      player.trailerY = player.y - Math.sin(player.angle) * player.hitchLength;
      player.trailerAngle = player.angle;
    }

    function buildLevel(level) {
      game.level = level;
      game.status = 'playing';
      game.parkingSpaces = [];
      game.parkedTrucks = [];

      const slotLayout = [
        { x: 100, y: 90, w: 140, h: 120 },
        { x: 270, y: 90, w: 140, h: 120 },
        { x: 440, y: 90, w: 140, h: 120 },
        { x: 610, y: 90, w: 140, h: 120 },
        { x: 100, y: 250, w: 140, h: 120 },
        { x: 270, y: 250, w: 140, h: 120 },
        { x: 440, y: 250, w: 140, h: 120 },
        { x: 610, y: 250, w: 140, h: 120 }
      ];

      slotLayout.forEach((slot, index) => {
        game.parkingSpaces.push({ ...slot, id: index, occupied: false, target: false });
      });

      const occupiedCount = clamp(3 + Math.floor(level / 2), 3, 6);
      const indices = shuffle([...game.parkingSpaces.keys()]).slice(0, occupiedCount);
      indices.forEach((i) => {
        game.parkingSpaces[i].occupied = true;
      });

      game.parkingSpaces.forEach((space, index) => {
        if (!space.occupied) return;
        const cx = space.x + space.w / 2;
        const cy = space.y + space.h / 2;
        game.parkedTrucks.push({
          x: cx,
          y: cy,
          angle: 0,
          w: 38,
          h: 82,
          color: index % 2 === 0 ? '#4b5563' : '#64748b'
        });
      });

      const open = game.parkingSpaces.filter((space) => !space.occupied);
      game.targetSlot = open[Math.floor(Math.random() * open.length)];
      game.targetSlot.target = true;

      resetPlayer();
      setStatus(`Level ${level}: Back into the highlighted bay and keep the lot clean.`, 'ready');
      updateHUD();
    }

    function updateTruck(dt) {
      if (game.status !== 'playing') return;

      const forward = keys['ArrowUp'] || keys['KeyW'];
      const reverse = keys['ArrowDown'] || keys['KeyS'];
      const left = keys['ArrowLeft'] || keys['KeyA'];
      const right = keys['ArrowRight'] || keys['KeyD'];

      if (left) player.steer = clamp(player.steer - 0.08, -1.15, 1.15);
      else if (right) player.steer = clamp(player.steer + 0.08, -1.15, 1.15);
      else player.steer *= 0.8;

      if (forward) player.speed += 0.16 * dt * 0.06;
      else if (reverse) player.speed -= 0.16 * dt * 0.06;
      else player.speed *= 0.987;

      player.speed = clamp(player.speed, -player.maxReverse, player.maxSpeed);

      const turnFactor = clamp(Math.abs(player.speed) / player.maxSpeed, 0.2, 1);
      const desiredAngle = player.angle + (player.speed / 48) * player.steer * turnFactor;
      player.angle = desiredAngle;

      const nextX = player.x + Math.cos(player.angle) * player.speed * 60 * (dt / 16.67);
      const nextY = player.y + Math.sin(player.angle) * player.speed * 60 * (dt / 16.67);
      player.x = clamp(nextX, 45, canvas.width - 45);
      player.y = clamp(nextY, 70, canvas.height - 60);

      const targetTrailerX = player.x - Math.cos(player.angle) * player.hitchLength;
      const targetTrailerY = player.y - Math.sin(player.angle) * player.hitchLength;
      const targetTrailerAngle = player.angle + player.steer * 0.25 * (Math.abs(player.speed) / player.maxSpeed);

      player.trailerX += (targetTrailerX - player.trailerX) * 0.2;
      player.trailerY += (targetTrailerY - player.trailerY) * 0.2;
      player.trailerAngle += normalizeAngle(targetTrailerAngle - player.trailerAngle) * 0.12;

      game.totalDistance += Math.abs(player.speed) * 0.14;
      audio.init();
      audio.setEngine(player.speed);
    }

    function checkCollisions() {
      if (game.status !== 'playing') return;

      const cabRect = rectFromBox(player.x, player.y, player.width, player.length, player.angle);
      const trailerRect = rectFromBox(player.trailerX, player.trailerY, player.trailerWidth, player.trailerLength, player.trailerAngle);

      for (const parked of game.parkedTrucks) {
        const parkedRect = {
          x: parked.x - parked.w / 2,
          y: parked.y - parked.h / 2,
          w: parked.w,
          h: parked.h
        };

        if (overlaps(cabRect, parkedRect) || overlaps(trailerRect, parkedRect)) {
          const now = performance.now();
          if (now - game.lastHitAt > 350) {
            game.lastHitAt = now;
            game.collisions += 1;
            game.score = Math.max(0, game.score - 40);
            game.combo = 0;
            player.speed *= -0.22;
            audio.init();
            audio.hit();
            setStatus('Contact! Slow down and re-center the trailer.', 'hit');
          }
          return;
        }
      }

      const roadRect = { x: 30, y: 65, w: canvas.width - 60, h: canvas.height - 125 };
      const bad =
        player.x < roadRect.x || player.x > roadRect.x + roadRect.w ||
        player.y < roadRect.y || player.y > roadRect.y + roadRect.h;

      if (bad) {
        const now = performance.now();
        if (now - game.lastHitAt > 350) {
          game.lastHitAt = now;
          game.collisions += 1;
          game.score = Math.max(0, game.score - 20);
          game.combo = 0;
          player.speed *= -0.18;
          audio.init();
          audio.hit();
          setStatus('Stay on the lot. The curb is not a parking spot.', 'hit');
        }
        return;
      }

      setStatus(`Level ${game.level}: Back into the highlighted bay and keep the lot clean.`, 'ready');
    }

    function checkParking() {
      if (game.status !== 'playing' || !game.targetSlot) return;

      const bay = game.targetSlot;
      const bayRect = { x: bay.x, y: bay.y, w: bay.w, h: bay.h };
      const cabRect = rectFromBox(player.x, player.y, player.width, player.length, player.angle);
      const trailerRect = rectFromBox(player.trailerX, player.trailerY, player.trailerWidth, player.trailerLength, player.trailerAngle);

      const insideBay =
        cabRect.x > bayRect.x - 12 && cabRect.x + cabRect.w < bayRect.x + bayRect.w + 12 &&
        cabRect.y > bayRect.y - 12 && cabRect.y + cabRect.h < bayRect.y + bayRect.h + 12 &&
        trailerRect.x > bayRect.x - 12 && trailerRect.x + trailerRect.w < bayRect.x + bayRect.w + 12 &&
        trailerRect.y > bayRect.y - 12 && trailerRect.y + trailerRect.h < bayRect.y + bayRect.h + 12;

      const aligned = Math.abs(normalizeAngle(player.angle)) < 0.45;
      const slowEnough = Math.abs(player.speed) < 0.18;

      if (insideBay && aligned && slowEnough) {
        game.status = 'parked';
        game.combo += 1;
        game.bestCombo = Math.max(game.bestCombo, game.combo);
        game.totalLoaded += 1;
        game.score += 500 + game.level * 140 + game.combo * 100;

        const perfect = Math.abs(player.speed) < 0.08 && Math.abs(normalizeAngle(player.angle)) < 0.12;
        if (perfect) {
          game.perfectParks += 1;
          game.score += 300;
        }

        audio.init();
        audio.success();
        setStatus(`Docked! Next truck incoming. Combo ${game.combo}x.`, 'parked');
        updateHUD();

        setTimeout(() => {
          game.level += 1;
          buildLevel(game.level);
        }, 1200);
      }
    }

    function drawBackground() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#0f1d25';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#183b2e';
      ctx.fillRect(0, 0, canvas.width, 70);
      ctx.fillRect(0, canvas.height - 70, canvas.width, 70);

      ctx.fillStyle = '#2d3748';
      ctx.fillRect(20, 70, canvas.width - 40, canvas.height - 140);

      ctx.strokeStyle = 'rgba(255,255,255,0.12)';
      ctx.lineWidth = 2;
      for (let x = 80; x < canvas.width; x += 90) {
        ctx.beginPath();
        ctx.moveTo(x, 70);
        ctx.lineTo(x, canvas.height - 70);
        ctx.stroke();
      }
    }

    function drawParkingSpaces() {
      for (const space of game.parkingSpaces) {
        ctx.save();
        ctx.fillStyle = space.target ? 'rgba(245,196,81,0.24)' : 'rgba(148,163,184,0.16)';
        ctx.strokeStyle = space.target ? '#f5c451' : '#e3ebf7';
        ctx.lineWidth = space.target ? 4 : 2;
        ctx.fillRect(space.x, space.y, space.w, space.h);
        ctx.strokeRect(space.x, space.y, space.w, space.h);
        ctx.restore();
      }
    }

    function drawParkedTruck(truck) {
      ctx.save();
      ctx.translate(truck.x, truck.y);
      ctx.rotate(truck.angle);
      ctx.fillStyle = truck.color;
      ctx.fillRect(-18, -40, 36, 80);
      ctx.fillStyle = '#dfe7f2';
      ctx.fillRect(-10, -26, 20, 52);
      ctx.restore();
    }

    function drawTruck(x, y, angle, trailerX, trailerY, trailerAngle, isPlayer) {
      ctx.save();
      ctx.translate(trailerX, trailerY);
      ctx.rotate(trailerAngle);
      ctx.fillStyle = isPlayer ? '#f59e0b' : '#9ca3af';
      ctx.fillRect(-14, -46, 28, 92);
      ctx.fillStyle = '#e2e8f0';
      ctx.fillRect(-10, -38, 20, 76);
      ctx.restore();

      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(angle);
      ctx.fillStyle = isPlayer ? '#ef4444' : '#4f46e5';
      ctx.fillRect(-15, -31, 30, 62);
      ctx.fillStyle = isPlayer ? '#fca5a5' : '#a5b4fc';
      ctx.fillRect(-8, -18, 16, 36);
      ctx.restore();
    }

    function draw() {
      drawBackground();
      drawParkingSpaces();
      for (const parked of game.parkedTrucks) drawParkedTruck(parked);
      drawTruck(player.x, player.y, player.angle, player.trailerX, player.trailerY, player.trailerAngle, true);
    }

    function loop(timestamp) {
      const dt = Math.min(32, timestamp - lastFrame || 16);
      lastFrame = timestamp;
      game.elapsed += dt;

      updateTruck(dt);
      checkCollisions();
      checkParking();
      updateHUD();
      draw();
      animationId = requestAnimationFrame(loop);
    }

    function initControls() {
      window.addEventListener('keydown', (event) => {
        if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(event.code)) event.preventDefault();
        keys[event.code] = true;
      });
      window.addEventListener('keyup', (event) => {
        keys[event.code] = false;
      });
    }

    function startGame() {
      game.score = 0;
      game.combo = 0;
      game.bestCombo = 0;
      game.totalLoaded = 0;
      game.perfectParks = 0;
      game.collisions = 0;
      game.totalDistance = 0;
      game.elapsed = 0;
      buildLevel(1);
      setStatus('Level 1: Back into the highlighted bay.', 'ready');
      updateHUD();
      if (animationId) cancelAnimationFrame(animationId);
      animationId = requestAnimationFrame(loop);
    }

    audio.init();
    initControls();
    buildLevel(1);
    updateHUD();
    animationId = requestAnimationFrame(loop);
  </script>
</body>
</html>
