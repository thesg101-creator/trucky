<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Truck Bay Parking</title>
  <style>
    :root {
      --bg: #07111a;
      --panel: #101b27;
      --panel2: #162533;
      --line: #dfe7f2;
      --gold: #f6c453;
      --green: #36d399;
      --red: #f87171;
      --hud: #edf3ff;
      --muted: #a7bacc;
      --road: #2d3748;
      --grass: #193926;
      --shadow: rgba(0,0,0,0.28);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: radial-gradient(circle at top, rgba(88, 130, 255, 0.18), transparent 30%), linear-gradient(180deg, #050d14 0%, #0c1723 100%);
      font-family: Arial, Helvetica, sans-serif;
      color: var(--hud);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 18px;
    }

    .game-shell {
      width: min(1100px, 96vw);
      background: rgba(10, 16, 23, 0.85);
      border: 1px solid rgba(148, 163, 184, 0.18);
      border-radius: 18px;
      box-shadow: 0 30px 60px rgba(0,0,0,0.45);
      overflow: hidden;
    }

    .hud {
      display: grid;
      grid-template-columns: repeat(5, minmax(120px, 1fr));
      gap: 10px;
      background: linear-gradient(180deg, rgba(16, 27, 39, 0.95), rgba(22, 37, 51, 0.95));
      padding: 14px 18px;
      border-bottom: 1px solid rgba(148, 163, 184, 0.16);
    }

    .stat {
      background: rgba(24, 38, 52, 0.9);
      border: 1px solid rgba(148, 163, 184, 0.16);
      border-radius: 12px;
      padding: 10px 12px;
      min-height: 80px;
    }

    .label {
      display: block;
      color: var(--muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-size: 0.65rem;
      margin-bottom: 8px;
    }

    .value {
      font-size: clamp(1.1rem, 1.65vw, 1.8rem);
      font-weight: 800;
      color: white;
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 18px;
      background: rgba(12, 20, 28, 0.9);
      border-bottom: 1px solid rgba(148, 163, 184, 0.12);
      flex-wrap: wrap;
      gap: 12px;
    }

    #missionText {
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .pill {
      border-radius: 999px;
      border: 1px solid rgba(45, 212, 191, 0.4);
      background: rgba(13, 148, 136, 0.18);
      color: #a7f3d0;
      padding: 7px 12px;
      font-size: 0.76rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      background: linear-gradient(180deg, #1f2d39 0%, #131d2a 100%);
      image-rendering: auto;
    }

    @media (max-width: 760px) {
      .hud {
        grid-template-columns: repeat(2, minmax(120px, 1fr));
      }
    }
  </style>
</head>
<body>
  <div class="game-shell">
    <div id="hud" class="hud"></div>
    <div class="status-bar">
      <div id="missionText">Back into the glowing bay. No scrolling camera.</div>
      <div id="statusPill" class="pill">Ready</div>
    </div>
    <canvas id="gameCanvas" width="960" height="640"></canvas>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const hud = document.getElementById('hud');
    const missionText = document.getElementById('missionText');
    const statusPill = document.getElementById('statusPill');

    const keys = {};
    let lastTimestamp = 0;
    let animationId = null;

    const audio = {
      ctx: null,
      master: null,
      hum: null,
      humGain: null,
      init() {
        if (this.ctx) return;
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        this.ctx = new AudioCtx();
        this.master = this.ctx.createGain();
        this.master.gain.value = 0.12;
        this.master.connect(this.ctx.destination);

        this.hum = this.ctx.createOscillator();
        this.hum.type = 'sawtooth';
        this.hum.frequency.value = 48;

        this.humGain = this.ctx.createGain();
        this.humGain.gain.value = 0.0001;

        this.hum.connect(this.humGain);
        this.humGain.connect(this.master);
        this.hum.start();
      },
      setEngine(speed) {
        if (!this.ctx || !this.humGain) return;
        const value = Math.min(0.11, 0.03 + Math.abs(speed) * 0.045);
        this.humGain.gain.setTargetAtTime(value, this.ctx.currentTime, 0.15);
        this.hum.frequency.setTargetAtTime(40 + Math.abs(speed) * 28, this.ctx.currentTime, 0.15);
      },
      beep(freq, duration = 0.16, volume = 0.065, sweep = 0) {
        if (!this.ctx || !this.master) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
        if (sweep) osc.frequency.linearRampToValueAtTime(freq + sweep, this.ctx.currentTime + duration);
        gain.gain.setValueAtTime(0.0001, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(volume, this.ctx.currentTime + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);
        osc.connect(gain);
        gain.connect(this.master);
        osc.start();
        osc.stop(this.ctx.currentTime + duration + 0.02);
      },
      good() {
        this.beep(440, 0.12, 0.09, 140);
        this.beep(660, 0.14, 0.09, 180);
      },
      bad() {
        this.beep(170, 0.18, 0.08, -70);
      }
    };

    const game = {
      level: 1,
      score: 0,
      combo: 0,
      bestCombo: 0,
      totalLoaded: 0,
      perfectParks: 0,
      collisions: 0,
      totalDistance: 0,
      elapsed: 0,
      targetBay: null,
      bays: [],
      parkedTrucks: [],
      status: 'ready'
    };

    const player = {
      x: 120,
      y: 500,
      angle: 0,
      speed: 0,
      steer: 0,
      width: 26,
      length: 60,
      trailerX: 120,
      trailerY: 420,
      trailerAngle: 0,
      trailerWidth: 28,
      trailerLength: 90,
      maxSpeed: 2.7,
      maxReverse: 1.8
    };

    function clamp(value, min, max) {
      return Math.min(max, Math.max(min, value));
    }

    function normalizeAngle(a) {
      while (a > Math.PI) a -= Math.PI * 2;
      while (a < -Math.PI) a += Math.PI * 2;
      return a;
    }

    function rectsOverlap(a, b) {
      return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
    }

    function shuffle(list) {
      const clone = [...list];
      for (let i = clone.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [clone[i], clone[j]] = [clone[j], clone[i]];
      }
      return clone;
    }

    function setStatus(text, tone = 'ready') {
      missionText.textContent = text;
      if (tone === 'ready') {
        statusPill.textContent = 'Ready';
        statusPill.style.background = 'rgba(13, 148, 136, 0.18)';
        statusPill.style.borderColor = 'rgba(45, 212, 191, 0.4)';
        statusPill.style.color = '#a7f3d0';
      } else if (tone === 'parked') {
        statusPill.textContent = 'Loaded';
        statusPill.style.background = 'rgba(54, 211, 153, 0.18)';
        statusPill.style.borderColor = 'rgba(54, 211, 153, 0.4)';
        statusPill.style.color = '#a7f3d0';
      } else if (tone === 'hit') {
        statusPill.textContent = 'Impact';
        statusPill.style.background = 'rgba(248, 113, 113, 0.18)';
        statusPill.style.borderColor = 'rgba(248, 113, 113, 0.48)';
        statusPill.style.color = '#fecaca';
      }
    }

    function updateHUD() {
      const accuracy = game.totalLoaded === 0 ? 0 : Math.round((game.perfectParks / game.totalLoaded) * 100);
      hud.innerHTML = `
        <div class="stat"><span class="label">Level</span><span class="value">${game.level}</span></div>
        <div class="stat"><span class="label">Score</span><span class="value">${game.score}</span></div>
        <div class="stat"><span class="label">Loaded</span><span class="value">${game.totalLoaded}</span></div>
        <div class="stat"><span class="label">Combo</span><span class="value">${game.combo}x</span></div>
        <div class="stat"><span class="label">Perfect</span><span class="value">${game.perfectParks}</span></div>
        <div class="stat"><span class="label">Best</span><span class="value">${game.bestCombo}</span></div>
        <div class="stat"><span class="label">Collisions</span><span class="value">${game.collisions}</span></div>
        <div class="stat"><span class="label">Distance</span><span class="value">${Math.round(game.totalDistance)}m</span></div>
        <div class="stat"><span class="label">Time</span><span class="value">${(game.elapsed / 1000).toFixed(1)}s</span></div>
        <div class="stat"><span class="label">Accuracy</span><span class="value">${accuracy}%</span></div>
      `;
    }

    function resetPlayer() {
      player.x = 110;
      player.y = 500;
      player.angle = 0;
      player.speed = 0;
      player.steer = 0;
      player.trailerX = player.x - Math.cos(player.angle) * 90;
      player.trailerY = player.y - Math.sin(player.angle) * 90;
      player.trailerAngle = player.angle;
    }

    function buildLevel(level) {
      game.level = level;
      game.status = 'playing';
      game.bays = [];
      game.parkedTrucks = [];

      const rows = [
        { x: 120, y: 110, w: 160, h: 110 },
        { x: 320, y: 110, w: 160, h: 110 },
        { x: 520, y: 110, w: 160, h: 110 },
        { x: 720, y: 110, w: 160, h: 110 },
        { x: 120, y: 280, w: 160, h: 110 },
        { x: 320, y: 280, w: 160, h: 110 },
        { x: 520, y: 280, w: 160, h: 110 },
        { x: 720, y: 280, w: 160, h: 110 }
      ];

      rows.forEach((slot, index) => {
        const occupied = index !== 0 && index !== 5 && index !== 7;
        game.bays.push({ ...slot, occupied, target: false, id: index });
      });

      const openBays = game.bays.filter((bay) => !bay.occupied);
      game.targetBay = openBays[Math.floor(Math.random() * openBays.length)];
      game.targetBay.target = true;

      game.bays.forEach((bay) => {
        if (!bay.occupied) return;
        const centerX = bay.x + bay.w / 2;
        const centerY = bay.y + bay.h / 2;
        game.parkedTrucks.push({
          x: centerX,
          y: centerY,
          w: 42,
          h: 90,
          angle: 0,
          color: Math.random() > 0.5 ? '#4b5563' : '#64748b'
        });
      });

      resetPlayer();
      setStatus(`Level ${level}: Find the glowing parking bay and back in without scraping.`, 'ready');
      updateHUD();
    }

    function truckBoxFor(x, y, angle, w, h) {
      const cos = Math.cos(angle);
      const sin = Math.sin(angle);
      const halfW = w / 2;
      const halfH = h / 2;
      const corners = [
        { x: -halfW, y: -halfH },
        { x: halfW, y: -halfH },
        { x: halfW, y: halfH },
        { x: -halfW, y: halfH }
      ].map((point) => ({
        x: x + (point.x * cos - point.y * sin),
        y: y + (point.x * sin + point.y * cos)
      }));
      const xs = corners.map((p) => p.x);
      const ys = corners.map((p) => p.y);
      return {
        x: Math.min(...xs),
        y: Math.min(...ys),
        w: Math.max(...xs) - Math.min(...xs),
        h: Math.max(...ys) - Math.min(...ys)
      };
    }

    function createCollisionBoxForVehicle(v) {
      return truckBoxFor(v.x, v.y, v.angle, v.w, v.h);
    }

    function checkCollisions() {
      const playerBox = truckBoxFor(player.x, player.y, player.angle, player.width, player.length);
      const trailerBox = truckBoxFor(player.trailerX, player.trailerY, player.trailerAngle, player.trailerWidth, player.trailerLength);

      for (const truck of game.parkedTrucks) {
        const parkedBox = { x: truck.x - truck.w / 2, y: truck.y - truck.h / 2, w: truck.w, h: truck.h };
        if (rectsOverlap(playerBox, parkedBox) || rectsOverlap(trailerBox, parkedBox)) {
          if (performance.now() - game.lastHitAt > 350) {
            game.collisions += 1;
            game.score = Math.max(0, game.score - 40);
            game.combo = 0;
            game.lastHitAt = performance.now();
            player.speed *= -0.2;
            audio.init();
            audio.bad();
            setStatus('Contact! Slow down and re-center the trailer.', 'hit');
          }
          return;
        }
      }

      const roadBounds = { x: 35, y: 70, w: canvas.width - 70, h: canvas.height - 120 };
      if (player.x < roadBounds.x || player.x > roadBounds.x + roadBounds.w || player.y < roadBounds.y || player.y > roadBounds.y + roadBounds.h) {
        if (performance.now() - game.lastHitAt > 350) {
          game.collisions += 1;
          game.score = Math.max(0, game.score - 25);
          game.combo = 0;
          game.lastHitAt = performance.now();
          player.speed *= -0.25;
          audio.init();
          audio.bad();
          setStatus('Stay on the parking lot. The curb is not a parking spot.', 'hit');
        }
        return;
      }

      setStatus(`Level ${game.level}: Find the glowing parking bay and back in without scraping.`, 'ready');
    }

    function updatePlayer(dt) {
      if (game.status !== 'playing') return;

      const accel = keys['ArrowUp'] || keys['KeyW'] ? 0.18 : 0;
      const brake = keys['ArrowDown'] || keys['KeyS'] ? 0.18 : 0;
      const steerLeft = keys['ArrowLeft'] || keys['KeyA'];
      const steerRight = keys['ArrowRight'] || keys['KeyD'];

      if (steerLeft) player.steer = clamp(player.steer - 0.075, -1.1, 1.1);
      else if (steerRight) player.steer = clamp(player.steer + 0.075, -1.1, 1.1);
      else player.steer *= 0.82;

      if (accel) player.speed += accel * dt * 0.04;
      else if (brake) player.speed -= brake * dt * 0.04;
      else player.speed *= 0.985;

      if (Math.abs(player.speed) > 0.03 && (steerLeft || steerRight)) {
        player.angle += (player.speed / 48) * player.steer * (0.3 + Math.abs(player.speed) / 2.8);
      }

      player.speed = clamp(player.speed, -player.maxReverse, player.maxSpeed);

      const nextX = player.x + Math.cos(player.angle) * player.speed * 60 * (dt / 16.67);
      const nextY = player.y + Math.sin(player.angle) * player.speed * 60 * (dt / 16.67);

      player.x = clamp(nextX, 50, canvas.width - 50);
      player.y = clamp(nextY, 70, canvas.height - 60);

      player.trailerX = player.x - Math.cos(player.angle) * 92;
      player.trailerY = player.y - Math.sin(player.angle) * 92;
      player.trailerAngle = player.angle;

      game.totalDistance += Math.abs(player.speed) * 0.12;
      audio.init();
      audio.setEngine(player.speed);
    }

    function checkParking() {
      if (game.status !== 'playing' || !game.targetBay) return;

      const bayRect = { x: game.targetBay.x, y: game.targetBay.y, w: game.targetBay.w, h: game.targetBay.h };
      const playerBox = truckBoxFor(player.x, player.y, player.angle, player.width, player.length);
      const trailerBox = truckBoxFor(player.trailerX, player.trailerY, player.trailerAngle, player.trailerWidth, player.trailerLength);

      const inside =
        playerBox.x > bayRect.x - 8 &&
        playerBox.x + playerBox.w < bayRect.x + bayRect.w + 8 &&
        playerBox.y > bayRect.y - 8 &&
        playerBox.y + playerBox.h < bayRect.y + bayRect.h + 8 &&
        trailerBox.x > bayRect.x - 8 &&
        trailerBox.x + trailerBox.w < bayRect.x + bayRect.w + 8 &&
        trailerBox.y > bayRect.y - 8 &&
        trailerBox.y + trailerBox.h < bayRect.y + bayRect.h + 8;

      const aligned = Math.abs(normalizeAngle(player.angle)) < 0.34;
      const slow = Math.abs(player.speed) < 0.18;

      if (inside && aligned && slow) {
        game.status = 'parked';
        game.combo += 1;
        game.bestCombo = Math.max(game.bestCombo, game.combo);
        game.totalLoaded += 1;
        game.score += 500 + game.level * 120 + game.combo * 100;

        const perfect = Math.abs(player.speed) < 0.08 && Math.abs(normalizeAngle(player.angle)) < 0.14;
        if (perfect) {
          game.perfectParks += 1;
          game.score += 200;
        }

        audio.good();
        setStatus(`Perfect park! Bay locked. Next load coming in...`, 'parked');
        updateHUD();

        setTimeout(() => {
          game.level += 1;
          buildLevel(game.level);
        }, 1300);
      }
    }

    function drawBackground() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#10262d';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#193926';
      ctx.fillRect(0, 0, canvas.width, 80);
      ctx.fillRect(0, canvas.height - 80, canvas.width, 80);

      ctx.fillStyle = '#2d3748';
      ctx.fillRect(35, 70, canvas.width - 70, canvas.height - 120);

      ctx.strokeStyle = 'rgba(255,255,255,0.14)';
      ctx.lineWidth = 2;
      for (let x = 70; x < canvas.width; x += 90) {
        ctx.beginPath();
        ctx.moveTo(x, 70);
        ctx.lineTo(x, canvas.height - 70);
        ctx.stroke();
      }

      ctx.beginPath();
      ctx.moveTo(0, 80);
      ctx.lineTo(canvas.width, 80);
      ctx.moveTo(0, canvas.height - 80);
      ctx.lineTo(canvas.width, canvas.height - 80);
      ctx.stroke();
    }

    function drawBay(bay) {
      ctx.save();
      const fill = bay.target ? 'rgba(246, 196, 83, 0.24)' : 'rgba(148, 163, 184, 0.18)';
      ctx.fillStyle = fill;
      ctx.strokeStyle = bay.target ? '#f6c453' : '#dfe7f2';
      ctx.lineWidth = bay.target ? 4 : 2;
      ctx.fillRect(bay.x, bay.y, bay.w, bay.h);
      ctx.strokeRect(bay.x, bay.y, bay.w, bay.h);
      ctx.restore();
    }

    function drawParkedTruck(v) {
      ctx.save();
      ctx.translate(v.x, v.y);
      ctx.rotate(v.angle);
      ctx.fillStyle = v.color;
      ctx.fillRect(-22, -45, 44, 90);
      ctx.fillStyle = '#cbd5e1';
      ctx.fillRect(-12, -30, 24, 60);
      ctx.restore();
    }

    function drawTruck(x, y, angle, trailerX, trailerY, trailerAngle, isPlayer) {
      ctx.save();
      ctx.translate(trailerX, trailerY);
      ctx.rotate(trailerAngle);
      ctx.fillStyle = isPlayer ? '#f59e0b' : '#9ca3af';
      ctx.fillRect(-14, -45, 28, 90);
      ctx.fillStyle = '#e2e8f0';
      ctx.fillRect(-10, -36, 20, 72);
      ctx.restore();

      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(angle);
      ctx.fillStyle = isPlayer ? '#ef4444' : '#4f46e5';
      ctx.fillRect(-13, -30, 26, 60);
      ctx.fillStyle = isPlayer ? '#fca5a5' : '#93c5fd';
      ctx.fillRect(-8, -18, 16, 36);
      ctx.restore();
    }

    function draw() {
      drawBackground();
      game.bays.forEach(drawBay);
      game.parkedTrucks.forEach(drawParkedTruck);
      drawTruck(player.x, player.y, player.angle, player.trailerX, player.trailerY, player.trailerAngle, true);
    }

    function loop(timestamp) {
      const dt = Math.min(32, timestamp - lastTimestamp || 16);
      lastTimestamp = timestamp;
      game.elapsed += dt;

      updatePlayer(dt);
      checkCollisions();
      checkParking();
      updateHUD();
      draw();
      animationId = requestAnimationFrame(loop);
    }

    function initControls() {
      window.addEventListener('keydown', (e) => {
        if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].includes(e.code)) e.preventDefault();
        keys[e.code] = true;
      });
      window.addEventListener('keyup', (e) => {
        keys[e.code] = false;
      });
    }

    function startGame() {
      game.score = 0;
      game.combo = 0;
      game.bestCombo = 0;
      game.totalLoaded = 0;
      game.perfectParks = 0;
      game.collisions = 0;
      game.totalDistance = 0;
      game.elapsed = 0;
      buildLevel(1);
      setStatus('Level 1: Back into the glowing bay. No camera scroll.', 'ready');
      if (animationId) cancelAnimationFrame(animationId);
      animationId = requestAnimationFrame(loop);
    }

    audio.init();
    initControls();
    buildLevel(1);
    updateHUD();
    animationId = requestAnimationFrame(loop);
  </script>
</body>
</html>
