<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Truck Parking Game</title>
    <style>
        body { margin: 0; background: #333; color: #fff; font-family: sans-serif; text-align: center; }
        canvas { background: #555; display: block; margin: 20px auto; border: 4px solid #222; }
        #ui { margin-top: 10px; }
    </style>
</head>
<body>
    <div id="ui">
        <h1>Truck Parking Game</h1>
        <p>Use Arrow Keys to Drive. Park in the yellow slot!</p>
        <button onclick="startLevel(1)">Level 1 (Empty)</button>
        <button onclick="startLevel(2)">Level 2 (Some Trucks)</button>
        <button onclick="startLevel(3)">Level 3 (Tight Fit)</button>
    </div>
    <canvas id="gameCanvas" width="800" height="600"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let truck = { x: 100, y: 300, angle: 0, speed: 0 };
        let parkingSlot = { x: 600, y: 250, w: 60, h: 100 };
        let obstacles = [];
        let currentLevel = 1;

        const keys = {};
        window.addEventListener('keydown', e => keys[e.code] = true);
        window.addEventListener('keyup', e => keys[e.code] = false);

        function startLevel(level) {
            currentLevel = level;
            truck = { x: 100, y: 300, angle: 0, speed: 0 };
            obstacles = [];
            
            if (level === 2) {
                obstacles.push({x: 600, y: 100, w: 50, h: 90});
                obstacles.push({x: 600, y: 400, w: 50, h: 90});
            } else if (level === 3) {
                obstacles.push({x: 600, y: 150, w: 50, h: 90});
                obstacles.push({x: 600, y: 360, w: 50, h: 90});
                parkingSlot.h = 80; // Tighter slot
            } else {
                parkingSlot.h = 100;
            }
        }

        function update() {
            if (keys['ArrowUp']) truck.speed = Math.min(truck.speed + 0.1, 3);
            else if (keys['ArrowDown']) truck.speed = Math.max(truck.speed - 0.1, -2);
            else truck.speed *= 0.95;

            if (keys['ArrowLeft']) truck.angle -= 0.03 * (truck.speed / 3);
            if (keys['ArrowRight']) truck.angle += 0.03 * (truck.speed / 3);

            truck.x += Math.cos(truck.angle) * truck.speed;
            truck.y += Math.sin(truck.angle) * truck.speed;

            // Win condition
            if (Math.abs(truck.x - (parkingSlot.x + parkingSlot.w/2)) < 20 &&
                Math.abs(truck.y - (parkingSlot.y + parkingSlot.h/2)) < 20 &&
                Math.abs(Math.sin(truck.angle)) < 0.1) {
                alert('Level Complete!');
                startLevel(currentLevel < 3 ? currentLevel + 1 : 1);
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Slot
            ctx.fillStyle = 'yellow';
            ctx.fillRect(parkingSlot.x, parkingSlot.y, parkingSlot.w, parkingSlot.h);

            // Draw Obstacles
            ctx.fillStyle = 'red';
            obstacles.forEach(o => ctx.fillRect(o.x, o.y, o.w, o.h));

            // Draw Truck
            ctx.save();
            ctx.translate(truck.x, truck.y);
            ctx.rotate(truck.angle);
            ctx.fillStyle = 'blue';
            ctx.fillRect(-25, -15, 50, 30);
            ctx.restore();
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        startLevel(1);
        loop();
    </script>
</body>
</html>
