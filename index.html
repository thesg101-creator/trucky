<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Truck Parking Game</title>
<style>
body { margin: 0; background: #222; color: #fff; font-family: sans-serif; text-align: center; }
canvas { background: #333; display: block; margin: 20px auto; border: 4px solid #111; }
#ui { margin-top: 10px; }
</style>
</head>
<body>
<div id="ui">
<h1>Truck Parking Game</h1>
<p>Use Arrow Keys to Drive. Park in the yellow slot!</p>
<button onclick="startLevel(1)">Level 1 (Empty)</button>
<button onclick="startLevel(2)">Level 2 (Some Trucks)</button>
<button onclick="startLevel(3)">Level 3 (Tight Fit)</button>
</div>
<canvas id="gameCanvas" width="800" height="600"></canvas>
<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let truck = { 
    x: 100, y: 300, angle: 0, speed: 0,
    trailerX: 70, trailerY: 300, trailerAngle: 0
};
let parkingSlot = { x: 600, y: 250, w: 120, h: 50 };
let obstacles = [];
let currentLevel = 1;

const keys = {};
window.addEventListener('keydown', e => keys[e.code] = true);
window.addEventListener('keyup', e => keys[e.code] = false);

function startLevel(level) {
    currentLevel = level;
    truck = { x: 100, y: 300, angle: 0, speed: 0, trailerX: 60, trailerY: 300, trailerAngle: 0 };
    if (level === 1) obstacles = [];
    if (level === 2) obstacles = [{x: 400, y: 200, w: 50, h: 200}];
    if (level === 3) obstacles = [{x: 300, y: 100, w: 400, h: 50}, {x: 500, y: 400, w: 50, h: 200}];
}

function update() {
    if (keys['ArrowUp']) truck.speed = Math.min(truck.speed + 0.1, 2);
    else if (keys['ArrowDown']) truck.speed = Math.max(truck.speed - 0.1, -1);
    else truck.speed *= 0.95;

    if (keys['ArrowLeft']) truck.angle -= 0.03 * (truck.speed / 2);
    if (keys['ArrowRight']) truck.angle += 0.03 * (truck.speed / 2);

    truck.x += Math.cos(truck.angle) * truck.speed;
    truck.y += Math.sin(truck.angle) * truck.speed;

    // Trailer physics
    let targetX = truck.x - Math.cos(truck.trailerAngle) * 40;
    let targetY = truck.y - Math.sin(truck.trailerAngle) * 40;
    let dx = truck.x - truck.trailerX;
    let dy = truck.y - truck.trailerY;
    truck.trailerAngle = Math.atan2(dy, dx);
    truck.trailerX = truck.x - Math.cos(truck.trailerAngle) * 40;
    truck.trailerY = truck.y - Math.sin(truck.trailerAngle) * 40;
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    // Draw Loading Area Floor
    ctx.fillStyle = '#444';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    // Draw Parking Slot
    ctx.strokeStyle = '#ffeb3b';
    ctx.lineWidth = 4;
    ctx.strokeRect(parkingSlot.x, parkingSlot.y, parkingSlot.w, parkingSlot.h);
    
    // Draw Obstacles
    ctx.fillStyle = '#666';
    obstacles.forEach(o => ctx.fillRect(o.x, o.y, o.w, o.h));

    // Draw Trailer (Cargo)
    ctx.save();
    ctx.translate(truck.trailerX, truck.trailerY);
    ctx.rotate(truck.trailerAngle);
    ctx.fillStyle = '#2196f3';
    ctx.fillRect(-30, -15, 50, 30);
    ctx.restore();

    // Draw Cab (Driver's Area)
    ctx.save();
    ctx.translate(truck.x, truck.y);
    ctx.rotate(truck.angle);
    ctx.fillStyle = '#f44336';
    ctx.fillRect(-10, -12, 30, 24);
    ctx.restore();
}

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
