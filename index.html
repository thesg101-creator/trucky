<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Truck Parking Yard</title>
  <style>
    :root {
      --bg: #0b1218;
      --panel: #101b24;
      --road: #2a3744;
      --grass: #12352b;
      --line: #edf3ff;
      --slot: rgba(255,255,255,0.08);
      --target: rgba(248, 199, 90, 0.24);
      --gold: #f8c75a;
      --green: #4ade80;
      --red: #f87171;
      --shadow: rgba(0,0,0,0.35);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(180deg, #0a1118, #0d171e);
      font-family: Arial, Helvetica, sans-serif;
      color: white;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
    }

    canvas {
      display: block;
      width: 960px;
      height: 620px;
      max-width: 100%;
      background: linear-gradient(180deg, #1f2d38 0%, #111a23 100%);
      border-radius: 12px;
      box-shadow: 0 30px 60px rgba(0,0,0,0.38);
      border: 1px solid rgba(255,255,255,0.08);
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas" width="960" height="620"></canvas>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const keys = {};
    let animationId = null;
    let lastFrame = 0;

    const audio = {
      ctx: null,
      master: null,
      humOsc: null,
      humGain: null,
      init() {
        if (this.ctx) return;
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        this.ctx = new AudioCtx();
        this.master = this.ctx.createGain();
        this.master.gain.value = 0.08;
        this.master.connect(this.ctx.destination);

        this.humOsc = this.ctx.createOscillator();
        this.humOsc.type = 'sawtooth';
        this.humOsc.frequency.value = 44;

        this.humGain = this.ctx.createGain();
        this.humGain.gain.value = 0.0001;

        this.humOsc.connect(this.humGain);
        this.humGain.connect(this.master);
        this.humOsc.start();
      },
      setEngine(speed) {
        if (!this.ctx || !this.humGain) return;
        const target = 0.015 + Math.min(0.11, Math.abs(speed) * 0.04);
        this.humGain.gain.setTargetAtTime(target, this.ctx.currentTime, 0.12);
        this.humOsc.frequency.setTargetAtTime(42 + Math.abs(speed) * 26, this.ctx.currentTime, 0.12);
      },
      tone(freq, duration = 0.15, volume = 0.07, sweep = 0) {
        if (!this.ctx || !this.master) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
        if (sweep) osc.frequency.linearRampToValueAtTime(freq + sweep, this.ctx.currentTime + duration);
        gain.gain.setValueAtTime(0.0001, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(volume, this.ctx.currentTime + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);
        osc.connect(gain);
        gain.connect(this.master);
        osc.start();
        osc.stop(this.ctx.currentTime + duration + 0.02);
      },
      success() {
        this.tone(540, 0.12, 0.09, 120);
        this.tone(760, 0.14, 0.09, 180);
      },
      hit() {
        this.tone(180, 0.18, 0.07, -75);
      }
    };

    const game = {
      level: 1,
      score: 0,
      combo: 0,
      bestCombo: 0,
      totalLoaded: 0,
      perfectParks: 0,
      collisions: 0,
      status: 'playing',
      parkingSpaces: [],
      parkedTrucks: [],
      targetSlot: null,
      lastHitAt: 0,
      elapsed: 0,
      won: false
    };

    const player = {
      x: 130,
      y: 520,
      angle: 0,
      speed: 0,
      steer: 0,
      cabWidth: 24,
      cabLength: 42,
      trailerWidth: 28,
      trailerLength: 90,
      hitchLength: 75,
      trailerX: 130,
      trailerY: 440,
      trailerAngle: 0,
      maxSpeed: 2.8,
      maxReverse: 1.8
    };

    function clamp(v, min, max) { return Math.min(max, Math.max(min, v)); }
    function normalizeAngle(a) {
      while (a > Math.PI) a -= Math.PI * 2;
      while (a < -Math.PI) a += Math.PI * 2;
      return a;
    }
    function shuffle(list) {
      const copy = [...list];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function rectForVehicle(x, y, width, length, angle) {
      const hw = width / 2;
      const hl = length / 2;
      const points = [
        { x: -hw, y: -hl },
        { x: hw, y: -hl },
        { x: hw, y: hl },
        { x: -hw, y: hl }
      ].map((p) => {
        const cos = Math.cos(angle);
        const sin = Math.sin(angle);
        return { x: x + p.x * cos - p.y * sin, y: y + p.x * sin + p.y * cos };
      });
      const xs = points.map(p => p.x);
      const ys = points.map(p => p.y);
      return { x: Math.min(...xs), y: Math.min(...ys), w: Math.max(...xs) - Math.min(...xs), h: Math.max(...ys) - Math.min(...ys) };
    }

    function overlaps(a, b) {
      return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
    }

    function resetPlayer() {
      player.x = 120;
      player.y = 520;
      player.angle = 0;
      player.speed = 0;
      player.steer = 0;
      player.trailerX = player.x - Math.cos(player.angle) * player.hitchLength;
      player.trailerY = player.y - Math.sin(player.angle) * player.hitchLength;
      player.trailerAngle = player.angle;
    }

    function buildLevel(level) {
      game.level = level;
      game.status = 'playing';
      game.parkingSpaces = [];
      game.parkedTrucks = [];
      game.targetSlot = null;
      game.won = false;

      const slots = [
        { x: 70, y: 76, w: 150, h: 120 },
        { x: 250, y: 76, w: 150, h: 120 },
        { x: 430, y: 76, w: 150, h: 120 },
        { x: 610, y: 76, w: 150, h: 120 },
        { x: 70, y: 246, w: 150, h: 120 },
        { x: 250, y: 246, w: 150, h: 120 },
        { x: 430, y: 246, w: 150, h: 120 },
        { x: 610, y: 246, w: 150, h: 120 }
      ];

      slots.forEach((slot, index) => {
        game.parkingSpaces.push({ ...slot, occupied: false, target: false, id: index });
      });

      const occupiedCount = clamp(3 + Math.floor(level / 2), 3, 6);
      const occupiedIndexes = shuffle([...game.parkingSpaces.keys()]).slice(0, occupiedCount);
      occupiedIndexes.forEach((idx) => { game.parkingSpaces[idx].occupied = true; });

      game.parkingSpaces.forEach((space, index) => {
        if (!space.occupied) return;
        game.parkedTrucks.push({
          x: space.x + space.w / 2,
          y: space.y + space.h / 2,
          width: 34,
          length: 70,
          angle: 0,
          color: index % 2 === 0 ? '#53677d' : '#6f8190'
        });
      });

      const open = game.parkingSpaces.filter((space) => !space.occupied);
      game.targetSlot = open[Math.floor(Math.random() * open.length)];
      game.targetSlot.target = true;

      resetPlayer();
      game.score += 0;
    }

    function updatePlayer(dt) {
      if (game.status !== 'playing') return;

      const forward = keys['ArrowUp'] || keys['KeyW'];
      const reverse = keys['ArrowDown'] || keys['KeyS'];
      const left = keys['ArrowLeft'] || keys['KeyA'];
      const right = keys['ArrowRight'] || keys['KeyD'];

      if (left) player.steer = clamp(player.steer - 0.08, -1.2, 1.2);
      else if (right) player.steer = clamp(player.steer + 0.08, -1.2, 1.2);
      else player.steer *= 0.8;

      if (forward) player.speed += 0.16 * dt * 0.06;
      else if (reverse) player.speed -= 0.14 * dt * 0.06;
      else player.speed *= 0.986;

      player.speed = clamp(player.speed, -player.maxReverse, player.maxSpeed);
      const turnFactor = clamp(Math.abs(player.speed) / player.maxSpeed, 0.25, 1);
      player.angle += (player.speed / 48) * player.steer * turnFactor;

      const nextX = player.x + Math.cos(player.angle) * player.speed * 60 * (dt / 16.67);
      const nextY = player.y + Math.sin(player.angle) * player.speed * 60 * (dt / 16.67);
      player.x = clamp(nextX, 32, canvas.width - 36);
      player.y = clamp(nextY, 70, canvas.height - 44);

      const hitchX = player.x - Math.cos(player.angle) * player.hitchLength;
      const hitchY = player.y - Math.sin(player.angle) * player.hitchLength;
      const desiredAngle = player.angle + player.steer * 0.15 * (Math.abs(player.speed) / player.maxSpeed);

      player.trailerX += (hitchX - player.trailerX) * 0.18;
      player.trailerY += (hitchY - player.trailerY) * 0.18;
      player.trailerAngle += normalizeAngle(desiredAngle - player.trailerAngle) * 0.16;

      audio.init();
      audio.setEngine(player.speed);
    }

    function checkCollisions() {
      if (game.status !== 'playing') return;

      const cabRect = rectForVehicle(player.x, player.y, player.cabWidth, player.cabLength, player.angle);
      const trailerRect = rectForVehicle(player.trailerX, player.trailerY, player.trailerWidth, player.trailerLength, player.trailerAngle);

      for (const parked of game.parkedTrucks) {
        const rect = {
          x: parked.x - parked.width / 2,
          y: parked.y - parked.length / 2,
          w: parked.width,
          h: parked.length
        };
        if (overlaps(cabRect, rect) || overlaps(trailerRect, rect)) {
          const now = performance.now();
          if (now - game.lastHitAt > 350) {
            game.lastHitAt = now;
            game.collisions += 1;
            game.combo = 0;
            game.score = Math.max(0, game.score - 40);
            player.speed *= -0.18;
            audio.init();
            audio.hit();
          }
          return;
        }
      }

      const lotBounds = { x: 20, y: 66, w: canvas.width - 40, h: canvas.height - 100 };
      const outOfBounds = player.x < lotBounds.x || player.x > lotBounds.x + lotBounds.w || player.y < lotBounds.y || player.y > lotBounds.y + lotBounds.h;
      if (outOfBounds) {
        const now = performance.now();
        if (now - game.lastHitAt > 350) {
          game.lastHitAt = now;
          game.collisions += 1;
          game.combo = 0;
          player.speed *= -0.22;
          audio.init();
          audio.hit();
        }
        return;
      }
    }

    function checkParking() {
      if (game.status !== 'playing' || !game.targetSlot) return;

      const bay = game.targetSlot;
      const bayRect = { x: bay.x, y: bay.y, w: bay.w, h: bay.h };
      const cabRect = rectForVehicle(player.x, player.y, player.cabWidth, player.cabLength, player.angle);
      const trailerRect = rectForVehicle(player.trailerX, player.trailerY, player.trailerWidth, player.trailerLength, player.trailerAngle);

      const fullyInside =
        cabRect.x > bayRect.x + 8 && cabRect.x + cabRect.w < bayRect.x + bayRect.w - 8 &&
        cabRect.y > bayRect.y + 8 && cabRect.y + cabRect.h < bayRect.y + bayRect.h - 8 &&
        trailerRect.x > bayRect.x + 8 && trailerRect.x + trailerRect.w < bayRect.x + bayRect.w - 8 &&
        trailerRect.y > bayRect.y + 8 && trailerRect.y + trailerRect.h < bayRect.y + bayRect.h - 8;

      const aligned = Math.abs(normalizeAngle(player.angle)) < 0.25;
      const slowEnough = Math.abs(player.speed) < 0.14;

      if (fullyInside && aligned && slowEnough) {
        game.status = 'parked';
        game.combo += 1;
        game.bestCombo = Math.max(game.bestCombo, game.combo);
        game.totalLoaded += 1;
        game.score += 600 + game.level * 140 + game.combo * 100;

        const perfect = Math.abs(player.speed) < 0.06 && Math.abs(normalizeAngle(player.angle)) < 0.08;
        if (perfect) {
          game.perfectParks += 1;
          game.score += 250;
        }

        audio.init();
        audio.success();

        setTimeout(() => {
          game.level += 1;
          buildLevel(game.level);
        }, 1200);
      }
    }

    function drawBackground() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#0d151b';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#123124';
      ctx.fillRect(0, 0, canvas.width, 58);
      ctx.fillRect(0, canvas.height - 58, canvas.width, 58);

      ctx.fillStyle = '#2d3944';
      ctx.fillRect(20, 58, canvas.width - 40, canvas.height - 116);

      // Painted lines to make lot feel real.
      ctx.strokeStyle = 'rgba(255,255,255,0.13)';
      ctx.lineWidth = 2;
      for (let x = 60; x < canvas.width; x += 90) {
        ctx.beginPath();
        ctx.moveTo(x, 58);
        ctx.lineTo(x, canvas.height - 58);
        ctx.stroke();
      }
      ctx.beginPath();
      ctx.moveTo(0, 58); ctx.lineTo(canvas.width, 58);
      ctx.moveTo(0, canvas.height - 58); ctx.lineTo(canvas.width, canvas.height - 58);
      ctx.stroke();
    }

    function drawParkingSpaces() {
      for (const space of game.parkingSpaces) {
        ctx.save();
        ctx.fillStyle = space.target ? 'rgba(248,199,90,0.22)' : 'rgba(255,255,255,0.04)';
        ctx.strokeStyle = space.target ? '#f8c75a' : '#edf3ff';
        ctx.lineWidth = space.target ? 4 : 2;
        ctx.fillRect(space.x, space.y, space.w, space.h);
        ctx.strokeRect(space.x, space.y, space.w, space.h);

        ctx.strokeStyle = 'rgba(255,255,255,0.18)';
        ctx.beginPath();
        ctx.moveTo(space.x + 10, space.y + 10);
        ctx.lineTo(space.x + space.w - 10, space.y + 10);
        ctx.stroke();
        ctx.restore();
      }
    }

    function drawParkedTruck(truck) {
      ctx.save();
      ctx.translate(truck.x, truck.y);
      ctx.rotate(truck.angle);
      ctx.fillStyle = truck.color;
      ctx.fillRect(-truck.width / 2, -truck.length / 2, truck.width, truck.length);
      ctx.fillStyle = '#dfe7f2';
      ctx.fillRect(-truck.width / 2 + 6, -truck.length / 2 + 8, truck.width - 12, truck.length - 16);
      ctx.restore();
    }

    function drawCab(x, y, angle, color) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(angle);
      ctx.fillStyle = color;
      ctx.fillRect(-18, -12, 36, 24);
      ctx.fillStyle = '#dfe7f2';
      ctx.fillRect(-6, -8, 12, 16);
      ctx.restore();
    }

    function drawTrailer(x, y, angle, color) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(angle);
      ctx.fillStyle = color;
      ctx.fillRect(-40, -14, 80, 28);
      ctx.fillStyle = 'rgba(255,255,255,0.25)';
      ctx.fillRect(-34, -11, 68, 22);
      ctx.restore();
    }

    function drawTruck() {
      drawTrailer(player.trailerX, player.trailerY, player.trailerAngle, '#f59e0b');
      drawCab(player.x, player.y, player.angle, '#ef4444');
    }

    function drawStatusPanel() {
      const statusText = game.status === 'parked'
        ? `Level ${game.level} • parked • combo ${game.combo}x`
        : `Level ${game.level} • target: bay ${game.targetSlot ? game.targetSlot.id + 1 : 0} • score ${game.score}`;

      ctx.save();
      ctx.fillStyle = 'rgba(11, 17, 24, 0.72)';
      ctx.fillRect(18, canvas.height - 42, Math.min(440, canvas.width - 36), 24);
      ctx.fillStyle = '#f8fafc';
      ctx.font = 'bold 14px Arial';
      ctx.fillText(statusText, 28, canvas.height - 24);
      ctx.restore();
    }

    function draw() {
      drawBackground();
      drawParkingSpaces();
      for (const truck of game.parkedTrucks) drawParkedTruck(truck);
      drawTruck();
      drawStatusPanel();
    }

    function loop(timestamp) {
      const dt = Math.min(32, timestamp - lastFrame || 16);
      lastFrame = timestamp;
      game.elapsed += dt;

      updatePlayer(dt);
      checkCollisions();
      checkParking();
      draw();
      animationId = requestAnimationFrame(loop);
    }

    function initControls() {
      window.addEventListener('keydown', (event) => {
        if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(event.code)) event.preventDefault();
        keys[event.code] = true;
      });
      window.addEventListener('keyup', (event) => {
        keys[event.code] = false;
      });
    }

    function start() {
      game.score = 0;
      game.combo = 0;
      game.bestCombo = 0;
      game.totalLoaded = 0;
      game.perfectParks = 0;
      game.collisions = 0;
      game.elapsed = 0;
      buildLevel(1);
      if (animationId) cancelAnimationFrame(animationId);
      animationId = requestAnimationFrame(loop);
    }

    initControls();
    audio.init();
    buildLevel(1);
    animationId = requestAnimationFrame(loop);
  </script>
</body>
</html>
